name: Update Versions And Logs

on:
  pull_request:
    types: [closed]
    branches:
      - dev

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pull-requests: write

jobs:
  run:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref != 'bump-branch'
    runs-on: ubuntu-latest
    name: Update ecommerce configs changelog

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check if index.html changed in merged PR
        id: check
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          MERGE="${{ github.event.pull_request.merge_commit_sha }}"
          if git diff --name-only "$BASE" "$MERGE" | grep -qx 'index.html'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump patch version
        if: steps.check.outputs.changed == 'true'
        id: bump
        run: |
          chmod +x scripts/bump-patch-version.sh
          NEW_VERSION=$(./scripts/bump-patch-version.sh)
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Push version bump via bump-branch PR
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin dev
          git checkout dev
          git reset --hard origin/dev

          chmod +x scripts/bump-patch-version.sh
          NEW_VERSION=$(./scripts/bump-patch-version.sh)

          git checkout -B bump-branch
          git add VERSION version.js
          git commit -m "chore: bump patch version to ${NEW_VERSION}"
          git push --force origin bump-branch

          EXISTING_PR=$(gh pr list --head bump-branch --base dev --state open --json number -q '.[0].number' || true)
          if [ -n "$EXISTING_PR" ]; then
            PR_NUMBER="$EXISTING_PR"
            echo "Reusing open PR #${PR_NUMBER}"
          else
            PR_URL=$(gh pr create \
              --base dev \
              --head bump-branch \
              --title "chore: bump patch version to ${NEW_VERSION}" \
              --body "Automated version bump after index.html change in #${{ github.event.pull_request.number }}.")
            PR_NUMBER="${PR_URL##*/}"
            echo "Created PR #${PR_NUMBER}"
          fi

          echo "Waiting for CI checks on PR #${PR_NUMBER}..."
          for i in $(seq 1 60); do
            if gh pr checks "$PR_NUMBER" >/tmp/checks.txt 2>&1; then
              cat /tmp/checks.txt
              echo "All checks passed."
              break
            fi

            if grep -q 'no checks reported' /tmp/checks.txt; then
              echo "Attempt ${i}/60: checks not registered yet..."
            else
              cat /tmp/checks.txt
              echo "Attempt ${i}/60: checks still pending..."
            fi
            sleep 10
          done

          gh pr update-branch "$PR_NUMBER" --merge 2>/dev/null || true
          sleep 5

          echo "Merging PR #${PR_NUMBER} into dev..."
          if gh pr merge "$PR_NUMBER" --merge --delete-branch; then
            echo "PR #${PR_NUMBER} merged into dev."
            exit 0
          fi

          echo "Regular merge blocked, retrying with admin bypass..."
          gh pr merge "$PR_NUMBER" --merge --delete-branch --admin
          echo "PR #${PR_NUMBER} merged into dev."
