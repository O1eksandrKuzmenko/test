name: Bump patch version

on:
  pull_request_target:
    types: [closed]
    branches:
      - dev

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-patch:
    if: >-
      github.event.pull_request.merged == true &&
      !startsWith(github.event.pull_request.title, 'chore: bump version')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Check if index.html changed in merged PR
        id: check
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          MERGE="${{ github.event.pull_request.merge_commit_sha }}"
          if git diff --name-only "$BASE" "$MERGE" | grep -qx 'index.html'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump patch version
        if: steps.check.outputs.changed == 'true'
        id: bump
        run: |
          chmod +x scripts/bump-patch-version.sh
          NEW_VERSION=$(./scripts/bump-patch-version.sh)
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.check.outputs.changed == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automated/version-bump-${{ github.run_id }}
          base: dev
          title: "chore: bump version to ${{ steps.bump.outputs.version }}"
          body: |
            Автоматично піднято patch-версію після merge PR #${{ github.event.pull_request.number }} зі змінами в `index.html`.

            Нова версія: **${{ steps.bump.outputs.version }}**
          commit-message: "chore: bump version to ${{ steps.bump.outputs.version }}"

      - name: Merge bump PR
        if: contains(fromJSON('["created", "updated"]'), steps.cpr.outputs.pull-request-operation)
        id: merge
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              merge_method: 'merge',
            });
            core.setOutput('merged', 'true');

      - name: Delete bump branch
        if: steps.merge.outputs.merged == 'true' && steps.cpr.outputs.head-ref != ''
        uses: actions/github-script@v7
        env:
          HEAD_REF: ${{ steps.cpr.outputs.head-ref }}
        with:
          script: |
            await github.rest.git.deleteRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${process.env.HEAD_REF}`,
            });
