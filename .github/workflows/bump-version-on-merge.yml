name: Update Versions And Logs

on:
  pull_request:
    types: [closed]
    branches:
      - dev

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pull-requests: write

jobs:
  run:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref != 'bump-branch'
    runs-on: ubuntu-latest
    name: Update ecommerce configs changelog

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check if index.html changed in merged PR
        id: check
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          MERGE="${{ github.event.pull_request.merge_commit_sha }}"
          if git diff --name-only "$BASE" "$MERGE" | grep -qx 'index.html'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump patch version
        if: steps.check.outputs.changed == 'true'
        id: bump
        run: |
          chmod +x scripts/bump-patch-version.sh
          NEW_VERSION=$(./scripts/bump-patch-version.sh)
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Push version bump via bump-branch PR
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -B bump-branch
          git add VERSION version.js
          git commit -m "chore: bump patch version to ${NEW_VERSION}"
          git push --force origin bump-branch

          EXISTING_PR=$(gh pr list --head bump-branch --base dev --state open --json number -q '.[0].number' || true)
          if [ -n "$EXISTING_PR" ]; then
            PR_NUMBER="$EXISTING_PR"
            echo "Reusing open PR #${PR_NUMBER}"
          else
            PR_URL=$(gh pr create \
              --base dev \
              --head bump-branch \
              --title "chore: bump patch version to ${NEW_VERSION}" \
              --body "Automated version bump after index.html change in #${{ github.event.pull_request.number }}.")
            PR_NUMBER="${PR_URL##*/}"
            echo "Created PR #${PR_NUMBER}"
          fi

          echo "Waiting for PR #${PR_NUMBER} checks and auto-merge..."
          gh pr merge "$PR_NUMBER" --auto --merge --delete-branch

          for i in $(seq 1 60); do
            STATE=$(gh pr view "$PR_NUMBER" --json state -q .state)
            if [ "$STATE" = "MERGED" ]; then
              echo "PR #${PR_NUMBER} merged into dev."
              exit 0
            fi

            MERGE_STATE=$(gh pr view "$PR_NUMBER" --json mergeStateStatus -q .mergeStateStatus)
            echo "Attempt ${i}/60: state=${STATE}, mergeStateStatus=${MERGE_STATE}"
            sleep 10
          done

          echo "Timed out waiting for PR #${PR_NUMBER} to merge."
          exit 1
