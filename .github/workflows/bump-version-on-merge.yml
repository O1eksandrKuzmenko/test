name: Update Versions And Logs

on:
  pull_request:
    types: [closed]
    branches:
      - dev

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref != 'bump-branch'
    runs-on: ubuntu-latest
    name: Update ecommerce configs changelog

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check if index.html changed in merged PR
        id: check
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          MERGE="${{ github.event.pull_request.merge_commit_sha }}"
          if git diff --name-only "$BASE" "$MERGE" | grep -qx 'index.html'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump patch version
        if: steps.check.outputs.changed == 'true'
        id: bump
        run: |
          chmod +x scripts/bump-patch-version.sh
          NEW_VERSION=$(./scripts/bump-patch-version.sh)
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
