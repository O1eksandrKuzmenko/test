name: Bump patch version

# pull_request_target + closed: права на створення PR (на звичайному pull_request — ні)
on:
  pull_request_target:
    types: [closed]
    branches:
      - dev

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-patch:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Check if index.html changed in merged PR
        id: check
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          MERGE="${{ github.event.pull_request.merge_commit_sha }}"
          if git diff --name-only "$BASE" "$MERGE" | grep -qx 'index.html'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump patch version
        if: steps.check.outputs.changed == 'true'
        id: bump
        run: |
          chmod +x scripts/bump-patch-version.sh
          NEW_VERSION=$(./scripts/bump-patch-version.sh)
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        if: steps.check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automated/version-bump-${{ github.run_id }}
          base: dev
          title: "chore: bump version to ${{ steps.bump.outputs.version }}"
          body: |
            Автоматично піднято patch-версію після merge PR #${{ github.event.pull_request.number }} зі змінами в `index.html`.

            Нова версія: **${{ steps.bump.outputs.version }}**
          commit-message: "chore: bump version to ${{ steps.bump.outputs.version }}"
